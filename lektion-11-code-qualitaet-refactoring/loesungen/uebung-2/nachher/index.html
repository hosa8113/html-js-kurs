<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>To-Do</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <main>
        <h1>To-Do</h1>
        <form id="form">
            <input type="text" id="input" placeholder="Neuer Task..." required minlength="2">
            <button type="submit">Hinzufügen</button>
        </form>
        <ul id="liste"></ul>
        <p id="status"></p>
    </main>
</body>
</html>
