<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button-Party</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <main>
        <h1>🎉 Button-Party</h1>

        <div class="buttons">
            <button id="btn-farbe">🎨 Farbe wechseln</button>
            <button id="btn-zufall">🎲 Zufallszahl</button>
            <button id="btn-emoji">😃 Zufalls-Emoji</button>
            <button id="btn-counter">🔢 Klick-Counter</button>
            <button id="btn-reset">↩️ Reset</button>
        </div>

        <div id="ausgabe" class="ausgabe">
            <p>Klick was.</p>
        </div>
    </main>
</body>
</html>
