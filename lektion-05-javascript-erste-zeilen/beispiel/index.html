<!DOCTYPE html>
<html lang="de">
<head>

    <title>Mein erstes JavaScript</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <main>
        <h1 id="titel">Willkommen auf meiner interaktiven Seite</h1>
