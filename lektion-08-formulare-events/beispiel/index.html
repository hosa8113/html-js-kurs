<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>To-Do-Liste</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <main>
        <h1>✅ To-Do-Liste</h1>

        <form id="form" class="eingabe">
            <input type="text" id="input" placeholder="Was möchtest du erledigen?" required minlength="2">
            <button type="submit">+ Hinzufügen</button>
        </form>

        <div class="filter">
            <button class="filter-btn aktiv" data-filter="alle">Alle</button>
            <button class="filter-btn" data-filter="offen">Offen</button>
            <button class="filter-btn" data-filter="erledigt">Erledigt</button>
        </div>

        <ul id="liste" class="liste"></ul>

        <p id="status" class="status">Noch nichts zu tun.</p>
    </main>
</body>
</html>
