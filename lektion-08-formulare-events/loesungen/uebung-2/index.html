<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-Manager</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <main>
        <h1>📋 Task-Manager</h1>

        <form id="form">
            <input type="text" id="text" name="text" placeholder="Task..." required minlength="2">

            <div class="form-row">
                <label>
                    Priorität:
                    <select id="prio" name="prio">
                        <option value="niedrig">🟢 Niedrig</option>
                        <option value="mittel" selected>🟡 Mittel</option>
                        <option value="hoch">🔴 Hoch</option>
                    </select>
                </label>

                <fieldset>
                    <legend>Kategorie</legend>
                    <label><input type="radio" name="kategorie" value="arbeit" checked> 💼 Arbeit</label>
                    <label><input type="radio" name="kategorie" value="privat"> 🏠 Privat</label>
                    <label><input type="radio" name="kategorie" value="schule"> 🎓 Schule</label>
                </fieldset>
            </div>

            <button type="submit">+ Hinzufügen</button>
        </form>

        <ul id="liste"></ul>
    </main>
</body>
</html>
