<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Einkaufsliste</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <main>
        <h1>🛒 Einkaufsliste</h1>

        <ul id="liste" class="liste"></ul>
    </main>
</body>
</html>
