<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do (persistiert)</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <main>
        <h1>💾 To-Do (bleibt gespeichert)</h1>
        <p class="hint">Lade die Seite neu — alles ist noch da.</p>

        <form id="form">
            <input type="text" id="input" placeholder="Neuer Task..." required minlength="2">
            <button type="submit">+ Hinzufügen</button>
        </form>

        <ul id="liste"></ul>

        <div class="footer">
            <span id="status">Keine Tasks.</span>
            <button id="btn-clear" class="clear">Alles löschen</button>
        </div>
    </main>
</body>
</html>
