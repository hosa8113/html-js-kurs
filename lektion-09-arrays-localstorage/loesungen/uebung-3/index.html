<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark-Manager</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <header>
        <h1>🔖 Meine Bookmarks</h1>
        <button id="btn-theme" class="theme-btn" title="Theme wechseln">🌙</button>
    </header>

    <main>
        <form id="form">
            <input type="text" id="titel" placeholder="Titel" required minlength="2">
            <input type="url" id="url" placeholder="https://..." required>
            <select id="kategorie">
                <option value="entwicklung">💻 Entwicklung</option>
                <option value="lernen">📚 Lernen</option>
                <option value="fun">🎉 Fun</option>
                <option value="news">📰 News</option>
                <option value="tools">🛠️ Tools</option>
            </select>
            <button type="submit">+ Speichern</button>
        </form>

        <div class="toolbar">
            <input type="text" id="suche" placeholder="🔍 Suchen...">
            <button id="btn-clear" class="clear">🗑️ Alle löschen</button>
        </div>

        <div id="stats" class="stats"></div>

        <ul id="liste" class="liste"></ul>
    </main>
</body>
</html>
